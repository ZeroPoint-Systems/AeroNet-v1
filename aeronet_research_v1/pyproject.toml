[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronet-research"
version = "0.2.0"
description = "Reproducible decentralised estimation and communication-policy experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aeronet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
