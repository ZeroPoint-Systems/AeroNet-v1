[project]
name = "aeronet2"
version = "0.1.0"
description = "Rigorous testbed for communication-efficient decentralised estimation over lossy networks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
