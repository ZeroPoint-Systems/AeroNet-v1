[project]
name = "aeronet"
version = "0.1.0"
description = "Critical information boundaries in decentralised collective autonomy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]
analysis = ["seaborn", "statsmodels", "scikit-learn", "jupyter"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
