# Pilot experiment 004.
#
# Compared with pilot_003, only the experiment ID and measurement noise
# differ. The seed and remaining settings are held fixed.

experiment:
  id: pilot_004
  seed: 12347

simulation:
  dt: 0.1
  duration: 20.0

target:
  x: 50.0
  y: 50.0

swarm:
  number_of_agents: 4
  spawn_radius: 10.0

sensing:
  measurement_noise: 5.0

communication:
  range: 25.0
  packet_loss_probability: 0.0
  latency: 0.0
  enable_fusion: false

estimation:
  method: reference_kalman
  initial_covariance: 100.0
  process_noise: 0.0
