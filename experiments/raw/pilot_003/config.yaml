# Pilot experiment 003.
#
# End-to-end runner validation using the same baseline conditions as the
# initial pilot runs, with a distinct experiment ID so their immutable
# output is preserved.

experiment:
  id: pilot_003
  seed: 12347

simulation:
  dt: 0.1
  duration: 20.0

target:
  x: 50.0
  y: 50.0

swarm:
  number_of_agents: 4
  spawn_radius: 10.0

sensing:
  measurement_noise: 1.0

communication:
  range: 25.0
  packet_loss_probability: 0.0
  latency: 0.0
  enable_fusion: false

estimation:
  method: reference_kalman
  initial_covariance: 100.0
  process_noise: 0.0
